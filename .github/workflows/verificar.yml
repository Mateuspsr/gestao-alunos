name: Verificar aplicação
on:
  push:
    branches: [modulo-iii, modulo-iii-react, integracao-polar-original]
  pull_request:
    branches: [modulo-iii]

jobs:
  teste:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: curso
          POSTGRES_PASSWORD: senha_ci_temporaria
          POSTGRES_DB: gestao_alunos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U curso -d gestao_alunos"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 6
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_NAME: gestao_alunos
      DB_USER: curso
      DB_PASSWORD: senha_ci_temporaria
      JWT_SECRET: "ci-exclusivamente-para-testes-nao-utilizar-em-producao"
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: "senha_temporaria_do_teste_2026"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependências do React
        run: npm install --prefix frontend
      - name: Validar TypeScript e compilar Vite
        run: npm run build --prefix frontend
      - name: Verificar sintaxe Python
        run: python -m compileall -q main.py db.py schemas.py auth.py tests
      - name: Instalar dependências da API
        run: python -m pip install -r requirements.txt
      - name: Iniciar FastAPI com PostgreSQL
        run: |
          nohup python -m uvicorn main:app --host 127.0.0.1 --port 8000 >/tmp/polar-api.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/polar-api.log
          exit 1
      - name: Testar contrato, JWT e integração HTTP
        run: python tests/integracao.py
      - name: Executar teste autenticado do projeto
        run: bash testar_api.sh
      - name: Preparar navegador de testes
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.56.1
          npx playwright install --with-deps chromium
      - name: Testar interface original no navegador
        run: npx playwright test tests/interface.spec.ts --workers=1 --reporter=line
